services:
  vikunja-mcp:
    build:
      context: ./vikunja-mcp
      dockerfile: Dockerfile
    container_name: vikunja-mcp
    restart: unless-stopped
    env_file:
      - .env
      - vikunja-mcp.env
    ports:
      - "${PORT:-8765}:8765"
    volumes:
      - ./vikunja-mcp/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
